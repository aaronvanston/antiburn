name: Remote helper

on:
  push:
    paths:
      - "crates/antiburn-remote/**"
      - "crates/antiburn-local/**"
      - ".github/workflows/remote-helper.yml"
  pull_request:
    paths:
      - "crates/antiburn-remote/**"
      - "crates/antiburn-local/**"
      - ".github/workflows/remote-helper.yml"

permissions:
  contents: read

jobs:
  helper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/antiburn-remote/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path crates/antiburn-remote/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/antiburn-remote/Cargo.toml
