[workspace]

[package]
name = "antiburn-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
antiburn-local = { path = "../antiburn-local" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "sync"] }

[dev-dependencies]
time = "0.3"
tempfile = "3"
